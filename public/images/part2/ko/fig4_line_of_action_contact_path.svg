  <!-- 10. Summary Formula Card -->
  <g class="summary-card" filter="url(#drop-shadow)">
    <rect x="60" y="510" width="1140" height="370" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3" />
    
    <!-- Header -->
    <text x="630" y="548" text-anchor="middle" class="formula-title">[물림선 접촉 궤적 및 정면 물림률 닫힌 해 수식]</text>
    <line x1="100" y1="566" x2="1160" y2="566" stroke="#cbd5e1" stroke-width="0.9" />
    
    <!-- Formulas -->
    <text x="120" y="614" class="formula-text">(1) 물림길이 닫힌 해: ga = √(ra1² - rb1²) + √(ra2² - rb2²) - a·sin α = 14.558 mm</text>
    <text x="120" y="668" class="formula-text">(2) 정면 물림률: εα = ga / pb = 14.558 / 8.856 = 1.644 ≥ 1.20 (설계 합격)</text>
    <text x="120" y="722" class="formula-text">(3) 접촉 구간 분담: 단일 치 접촉 g1 = 3.155 mm (21.7%), 이중 치 접촉 g2 = 11.403 mm (78.3%)</text>
    
    <line x1="100" y1="760" x2="1160" y2="760" stroke="#cbd5e1" stroke-width="0.9" />
    
    <!-- Engineering Note -->
    <text x="630" y="798" text-anchor="middle" class="formula-note">[공학적 의의] εα ≥ 1.20 확보로 전달 오차 완충 및 무충격 연속 동력 전달 보장</text>
    <text x="630" y="834" text-anchor="middle" class="formula-params">[설계 제원] m = 3.0 mm, z₁ = 19, z₂ = 47, α = 20.0°, a = 99.0 mm (ISO 21771 / DIN 3960 Closed-Form)</text>
  </g>
</svg>
