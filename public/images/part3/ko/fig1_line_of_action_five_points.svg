        <text id="dim-text-ga" x="0" y="-9" text-anchor="middle" font-size="13" font-weight="600" fill="#ea580c">실제 접촉 궤적 AE (ga = gf + ga = 14.602 mm)</text>
      </g>
    
  
      <!-- Extension lines -->
      <line x1="583.00" y1="315.17" x2="533.44" y2="451.33" stroke="#cbd5e1" stroke-width="0.9" stroke-dasharray="3,3" />
