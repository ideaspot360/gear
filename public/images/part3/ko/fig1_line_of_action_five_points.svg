  <!-- 10. Summary Formula Card -->
  <g class="summary-card" filter="url(#drop-shadow)">
    <rect x="60" y="510" width="1140" height="360" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3" />
    
    <!-- Header -->
    <text x="630" y="548" text-anchor="middle" class="formula-title">[작용선 5대 특이점과 맞물림 궤적 기하학적 정밀 요약]</text>
    <line x1="100" y1="566" x2="1160" y2="566" stroke="#cbd5e1" stroke-width="0.9" />
    
    <!-- Formulas -->
    <text x="120" y="614" class="formula-text">(1) 5대 특이점: 점 A (SAP) ➔ 점 B (LPSTC) ➔ 점 P (피치점) ➔ 점 D (HPSTC) ➔ 점 E (EAP)</text>
    <text x="120" y="668" class="formula-text">(2) 물림길이 및 법선 피치: gf = 7.828 mm, ga = 6.774 mm ➔ ga = 14.602 mm, pb = 8.856 mm</text>
    <text x="120" y="722" class="formula-text">(3) 정면 물림률: εα = ga / pb = 14.602 / 8.856 = 1.649 ≥ 1.200 (설계 합격)</text>
    
    <line x1="100" y1="760" x2="1160" y2="760" stroke="#cbd5e1" stroke-width="0.9" />
    
    <!-- Engineering Note -->
    <text x="630" y="798" text-anchor="middle" class="formula-note">[공학적 의의] 단일 접촉 21.3% (g1 = 3.111 mm), 이중 접촉 78.7% (g2 = 11.491 mm) 분할 보존</text>
    <text x="630" y="834" text-anchor="middle" class="formula-params">[설계 제원] m = 3.0 mm, z₁ = 18, z₂ = 54, α₀ = 20.0°, a = 108.0 mm (ISO 21771 / DIN 3960 Closed-Form)</text>
  </g>
